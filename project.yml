name: Fettle
options:
  bundleIdPrefix: com.itsadee
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  SWIFT_VERSION: "6.0"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  SWIFT_STRICT_CONCURRENCY: complete
targets:
  Fettle:
    type: application
    platform: macOS
    sources:
      - path: Fettle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itsadee.fettle
        PRODUCT_NAME: Fettle
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fettle
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        CODE_SIGN_ENTITLEMENTS: Fettle/Fettle.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_TESTABILITY: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    scheme:
      testTargets:
        - FettleTests
  FettleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FettleTests
    dependencies:
      - target: Fettle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itsadee.fettleTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Fettle.app/Contents/MacOS/Fettle"
        BUNDLE_LOADER: "$(TEST_HOST)"
